<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Cálculo de Finanças</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      /* Fundo da página */
      body {
        background-image: url('https://einvestidor.estadao.com.br/wp-content/uploads/2024/08/adobestock-265053102-1_080820240635.jpeg-e1723156833369.webp');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
      }

      /* Caixa principal */
      .d {
        background-color: rgba(255, 255, 255, 0.9); /* fundo levemente transparente */
        padding: 20px;
        margin: 30px auto;
        max-width: 600px;
        border: 2px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
      }

      /* Título */
      .tx {
        background-color: rgb(247, 248, 245);
        padding: 30px;
        text-align: center;
        border: 2px solid black;
        border-radius: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- Título da página -->
    <h1 class="tx">Cálculo de Finanças</h1>
    
    <div class="d">
      <h3>Este site te ajudará a calcular seus investimentos</h3>

      <!-- Seção de juros simples -->
      <h2>Juros Simples</h2>
      <label for="capital">Capital:</label>
      <input type="number" id="capital" placeholder="Digite o capital">

      <br>
      <label for="juros">Juros:</label>
      <span id="juros"></span> <!-- Aqui o select será injetado pelo JS -->

      <br>
      <label for="tempo">Anos:</label>
      <input type="number" id="tempo" placeholder="Digite os anos">

      <button id="botao">Calcular</button>

      <h3>Montante: <span id="resultado"></span></h3>

      <!-- Seção de juros compostos -->
      <h2>Juros Compostos</h2>
      <label for="capital1">Capital:</label>
      <input type="number" id="capital1" placeholder="Digite o capital">

      <br>
      <label for="juros1">Juros:</label>
      <span id="juros1"></span> <!-- Aqui o select será injetado pelo JS -->

      <br>
      <label for="tempo1">Anos:</label>
      <input type="number" id="tempo1" placeholder="Digite os anos">

      <button id="bot">Calcular</button>

      <h3>Montante: <span id="resultad"></span></h3>
    </div>

    <!-- Arquivo JavaScript externo -->
    <script src="calculo.js"></script>
  </body>
</html>
